# Open-science / open-access settings and UI copy (WP-J). Everything the /open/ page and the request component say lives here.
# Owner: edit the wording freely; nothing is generated into this file. Items (what is open / on request) are in open_catalog.yml.
# DISCLOSURE_POLICY.md still decides what may be published at all: a file is only ever listed as open after you approve it.

# Request form. Leave "" to hide the form (the email route still works). Paste your form endpoint (Formspree, Getform, a Google
# Apps Script web app, ...) to show it; "form enabled" is derived in the templates from a non-empty endpoint, there is no separate switch.
form_endpoint: ""

# Email route. The address is NEVER printed here or in static HTML: it comes from _data/socials.yml (email:) through the
# site's protect_email mechanism (data-eu / data-ed halves) and is only joined in the browser when somebody clicks.
# Placeholders: {title} {id} {url}
email:
  subject: "Open access request: {title} ({id})"
  body: |
    Hello,

    I would like the code and PDF notes for: {title}
    Item id: {id}
    Page: {url}

    Name:
    Affiliation (optional):
    What I plan to use it for (optional):

    Thank you.
  owner_to_confirm: true

# Licences offered with shared files. owner_to_confirm: true until you have read and accepted them.
license_code: "MIT"
license_docs: "CC BY 4.0"
license_owner_to_confirm: true

