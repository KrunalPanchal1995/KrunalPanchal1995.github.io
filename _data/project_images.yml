- index: 21
  caption: 'Budget Residual Field: a genuine limitation found applying the technique
    to a relaxed RANS solve'
  topic: budget-analysis
  description: The local imbalance of Realizable k-ε's own EXACT discrete k-equation
    (face-averaged-diffusivity finite-volume form, reproduced verbatim from the closure's
    own code), evaluated at every node post-solve. Contrary to a first-guess expectation
    ("near-zero at interior nodes, large only at wall-function Dirichlet rows"), the
    MEASURED residual is large at every node — traced to this closure's own under-relaxed
    nested-Picard design, which intentionally damps oscillation at the cost of the
    returned k/ε ever exactly satisfying the discrete equation with the final eddy
    viscosity at any single instant. A genuine, disclosed LIMITATION of this diagnostic
    technique for relaxed-iterative RANS solves, kept in as the honest result rather
    than replaced with a cleaner cherry-picked case.
  src_800: assets/img/projects/turbulence-closures/021_tv_fig10_budget_residual_field-800.png
  src_1600: assets/img/projects/turbulence-closures/021_tv_fig10_budget_residual_field-1600.png
- index: 22
  caption: 'Backscatter Flash Map: spatial structure of upscale energy transfer (invented
    technique)'
  topic: invented-technique
  description: 'Left: the full vorticity field evolving under Smagorinsky LES. Right:
    the spatial structure reconstructed from ONLY the wavenumber shells where the
    resolved-scale spectral flux Π(k) is currently negative — i.e. energy moving up-scale
    at that instant, "backscatter" in the LES sense (Piomelli et al., 1991). Deliberately
    NOT the same as a local eddy-viscosity SGS model''s own dissipation field (non-negative
    by construction, can never itself display backscatter) — this is the RESOLVED-scale
    flux''s own negative-transfer content, made spatially visible instead of left
    as an abstract k-space curve. Novelty search: found spectral-flux plots and backscatter
    discussion in the LES literature, but no video reconstructing and displaying the
    specific spatial structure responsible for backscatter at each instant.'
  src_800: assets/img/projects/turbulence-closures/022_tv_mov04_backscatter_flash_map-800.png
  src_1600: assets/img/projects/turbulence-closures/022_tv_mov04_backscatter_flash_map-1600.png
  video: assets/img/projects/turbulence-closures/022_tv_mov04_backscatter_flash_map.mp4
- index: 23
  caption: Velocity-increment PDFs at several separations
  topic: statistics
  description: 'δu(r)=u(x+r)-u(x) histogrammed at r=1,4,16 grid points (normalized
    by each separation''s own standard deviation), log-scale y-axis, against a Gaussian
    reference. HONEST RESULT: all three separations track the Gaussian closely, with
    no clear widening of the tails at small r — the classical 3D-turbulence intermittency
    signature is NOT detected here. This is not claimed as a general property of turbulence;
    it reflects this specific case''s real limitations (a single decaying 2D snapshot,
    heavily damped by the Smagorinsky SGS closure, too small a statistical sample
    for a reliable tail measurement), not a claim that turbulence lacks intermittency.'
  src_800: assets/img/projects/turbulence-closures/023_tv_fig11_velocity_increment_pdf-800.png
