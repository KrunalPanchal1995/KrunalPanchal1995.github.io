  caption: First-layer saturation across a 16-version normalization ablation
  topic: diagnostics
  description: 'Whether the network''s first tanh layer saturates (a classic vanishing-gradient
    failure mode), swept across sixteen single-variable versions of the same architecture.
    Every version training directly in raw physical units (red titles) saturates fully;
    the three versions built on a per-channel [0,1] normalization (green titles: v1.3,
    v1.14, v1.15) never fully saturate — a normalization choice with a large, mechanistic
