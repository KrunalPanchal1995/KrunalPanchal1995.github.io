- index: 5
  caption: Four solvers racing to the Rosenbrock minimum on a shared evaluation budget
  topic: solver-visualization
  description: Nelder-Mead, IPOP-CMA-ES, and two independent L-BFGS-B implementations
    (dokimazo's own native solver and a thin scipy wrapper) searching the same landscape
    on one shared cumulative-function-evaluation clock — not iteration count, which
    would make gradient-based methods look free next to population-based ones. The
    right-hand panel is the actual scoreboard — best-so-far objective value vs. evaluations
    spent, log-scaled, so two independent implementations converging to the same path
    (as the two L-BFGS-B variants genuinely do here) reads as "these agree," not "one
