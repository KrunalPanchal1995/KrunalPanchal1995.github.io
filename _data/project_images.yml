  video: assets/video/dokimazo/11_surface_himmelblau.mp4
  src_800: assets/img/projects/dokimazo/11_surface_himmelblau_poster-800.png
- index: 12
  caption: A fixed-slice projection of the 3-variable trajectory
  topic: solver-visualization
  description: 'Companion static figure to the 3-decision-variable trajectory result:
    a 2-variable log10(1+f) height-map slice taken at the search''s own found x3,
