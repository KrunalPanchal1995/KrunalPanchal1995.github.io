  caption: Segre-Silberberg tubular pinch — bidirectional migration
  topic: mfV-validation
  description: 'A real 3D flow field and a real 3D particle tracer reproduce the Segre-Silberberg
    (1962) inertial-migration mechanism directly: all four tracked particles move
    toward an intermediate equilibrium radius, two from inside moving out and two
    from outside moving in. The model''s own self-consistent equilibrium (0.5R) differs
    from the literature''s fitted value (0.6R) — a disclosed, understood quantitative
    miss (a direct, expected consequence of using a documented literature substitution
    for a paywalled fitted coefficient), not a hidden one.'
  src_800: assets/img/projects/cfdcore/022_a6_segre_silberberg-800.png
  src_1600: assets/img/projects/cfdcore/022_a6_segre_silberberg-1600.png
- index: 23
  caption: Dean secondary-flow intensity scaling
  topic: mfV-validation
  description: 'Measured Dean secondary-flow intensity vs. Dean number in a curved
    channel: local log-log slope 1.99-2.01 at low De matches Dean''s (1928) theoretical
    De^2 scaling almost exactly, declining toward Ookawara''s (2004) De^1.63 high-De
    asymptote — the classic curved-duct secondary-flow signature, reproduced quantitatively.'
  src_800: assets/img/projects/cfdcore/023_a5_dean_intensity-800.png
  src_1600: assets/img/projects/cfdcore/023_a5_dean_intensity-1600.png
- index: 24
  caption: Four-vortex transition — a disclosed miss
  topic: mfV-validation
  description: 'A documented miss, kept in rather than dropped: the literature predicts
    a transition from a two-vortex to a four-vortex Dean secondary flow at a critical
    Dean number (visible as a 1-to-3 jump in an outer-wall-crossing probe). This model''s
    own probe stays at 1 crossing across the full swept range — investigated directly
    (a perturbed-restart search relaxes back to the same state at machine precision),
    so this reads as a genuine limitation of the current formulation, not an under-searched
    parameter.'
  src_800: assets/img/projects/cfdcore/024_a5_four_vortex_miss-800.png
  src_1600: assets/img/projects/cfdcore/024_a5_four_vortex_miss-1600.png
- index: 25
  caption: Brinkman-channel exact solution
  topic: mfV-validation
  description: 'The closed-form Brinkman-channel velocity profile the density-based
    topology-optimization formulation actually solves, at four penalization strengths:
    plain Poiseuille flow smoothly deforms into a thin-wall-layer "plug" profile as
    the penalization parameter grows, with the ODE residual checked below 1e-6 relative
    (ForwardDiff-verified) at every value.'
  src_800: assets/img/projects/cfdcore/025_d1_brinkman_exact_profiles-800.png
  src_1600: assets/img/projects/cfdcore/025_d1_brinkman_exact_profiles-1600.png
- index: 26
  caption: Brinkman penalization vs. a body-fitted mesh
  topic: mfV-validation
  description: 'Cross-checking the Brinkman penalization method (used for topology
    optimization) against a genuinely body-fitted mesh of the same geometry: leak
    velocity inside the penalized "solid" region falls monotonically as expected,
    but the velocity mismatch outside it is non-monotonic in the penalization strength
    — a real, mesh-resolution-dependent conditioning effect, confirmed (not just observed)
    by re-running at 4x finer resolution and watching both the minimum-error location
    and its achievable value shift in the predicted direction.'
  src_800: assets/img/projects/cfdcore/026_d2_brinkman_vs_bodyfitted-800.png
  src_1600: assets/img/projects/cfdcore/026_d2_brinkman_vs_bodyfitted-1600.png
- index: 27
  caption: Dissipated-power identity check
  topic: mfV-validation
  description: 'A physical consistency check on the objective functional a topology
    optimization would minimize: total viscous dissipation computed one way (integrating
    Phi(u) over the domain) against computed a completely independent way (pressure
    drop times flow rate) agree to within FEM discretization error (0.08% and 0.18%
    for the two viscous-term formulations tested).'
  src_800: assets/img/projects/cfdcore/027_d3_dissipated_power_identity-800.png
  src_1600: assets/img/projects/cfdcore/027_d3_dissipated_power_identity-1600.png
- index: 28
  caption: Analytic design-sensitivity gradient vs. finite differences
  topic: mfV-validation
  description: 'The pre-optimization gate any gradient-based topology optimization
    depends on: the analytic design-sensitivity gradient overlaid exactly on a central-finite-difference
