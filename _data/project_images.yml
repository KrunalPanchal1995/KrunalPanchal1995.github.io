    the h2o2_he.yaml mechanism (29 reactions), its thermo and transport files, and
    the 426-target experimental target file (426 total targets; 52 run here for a
    fast demo pass).'
  src_800: assets/img/projects/mosiac/019_02_nominal_filled-800.png
  src_1600: assets/img/projects/mosiac/019_02_nominal_filled-1600.png
- index: 20
  caption: Step 3 — running (GUI stays responsive)
  topic: wt-3-nominal-running
  description: The run in progress. Nominal Simulation runs on a background thread
