neural-ode-playground:
- index: 1
  caption: 12-optimizer race on the Van der Pol benchmark
  topic: optimizer-race
  description: All 12 gradient optimizers trained from scratch on the same tiny synthetic
    problem (a Van der Pol oscillator, this project's non-chemistry test family),
    same seed, same budget. Nadam reached the lowest final loss; L-BFGS, Adadelta,
    and plain SGD were still an order of magnitude worse after 80 epochs on this particular
    problem — reported as-is, including the optimizers that didn't do well here.
  src_800: assets/img/projects/neural-ode-playground/001_optimizer_race-800.png
- index: 2
  caption: Normalization ablation — raw baseline vs. 9 normalized arms
  topic: ablation
  description: The project's own headline finding — a real 50-run, 5-seed factorial
    ablation (matched-seed paired t-test) shows normalizing temperature cuts test
    loss by roughly an order of magnitude (2.314e5 to 2.662e4, p = 3e-15) — normalizing
    species alone, with temperature left raw, changes nothing, bit-for-bit, because
    temperature's gradient already owns effectively 100% of an equal-weight loss.
  src_800: assets/img/projects/neural-ode-playground/002_ablation_comparison-800.png
  src_1600: assets/img/projects/neural-ode-playground/002_ablation_comparison-1600.png
