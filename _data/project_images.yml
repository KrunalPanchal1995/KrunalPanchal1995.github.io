    step sizes — a wrong gradient here would silently break every downstream optimization
    result, so it is checked directly rather than assumed.'
  src_800: assets/img/projects/cfdcore/028_d4_gradient_vs_finite_differences-800.png
  src_1600: assets/img/projects/cfdcore/028_d4_gradient_vs_finite_differences-1600.png
