turbulence-closures:
- index: 1
  caption: LES energy-spectrum validation, freely-decaying 2D turbulence
  topic: les
  description: Radially-averaged kinetic-energy spectrum $E(k)$ for freely-decaying
    2D turbulence (McWilliams 1984 initial condition, doubly-periodic domain, $\nu$=0.0005)
    at $t=1.0$. The fine-resolution DNS reference (N=256) develops the theoretical
    $E(k)\sim k^{-3}$ enstrophy-cascade slope (Kraichnan/Batchelor) almost exactly
    (measured slope -3.033). At a 8x coarser resolution (N=32) representative of a
    practical LES grid, the classic 2D energy-pile-up failure mode appears when no
    sub-grid-scale model is used; adding a Smagorinsky SGS closure ($C_s$=0.17, Lilly's
    isotropic-turbulence value) reduces the absolute resolved-scale energy error against
    the DNS reference by a factor of 3.3x. Single realization, one Reynolds-number-like
    setting — a genuine, measured demonstration that the SGS closure does useful work
    in this minimal case, not a general accuracy claim across turbulent regimes.
  src_800: assets/img/projects/turbulence-closures/001_fig01_energy_spectrum-800.png
  src_1600: assets/img/projects/turbulence-closures/001_fig01_energy_spectrum-1600.png
- index: 2
  caption: '2D vorticity field: initial condition, unresolved LES, SGS-closed LES'
  topic: les
  description: 'Vorticity field snapshots for the same freely-decaying 2D turbulence
    case. Left: the McWilliams (1984) random-phase initial condition. Center: after
    evolving to $t=1.0$ on an under-resolved 32x32 grid with no sub-grid-scale closure
    — small-scale vortical structure is visibly coarser/noisier than the physical
    cascade would produce. Right: the same initial condition and grid, now with a
    Smagorinsky SGS closure — the large coherent vortices are preserved while excess
    small-scale noise is damped, consistent with the energy-spectrum improvement quantified
    alongside this figure.'
  src_800: assets/img/projects/turbulence-closures/002_fig02_vorticity_snapshots-800.png
  src_1600: assets/img/projects/turbulence-closures/002_fig02_vorticity_snapshots-1600.png
- index: 3
  caption: 'Turbulence video: freely-decaying 2D vorticity field evolution'
  topic: les
  description: 'Time evolution of the vorticity field for freely-decaying 2D turbulence
    under a Smagorinsky sub-grid-scale closure ($C_s$=0.17), N=96, $\nu$=0.0003, from
    $t=0$ to $t=3$. The classic 2D turbulence signature is visible: same-signed vortices
    merge over time (the inverse energy cascade toward larger scales), while enstrophy
    cascades to small scales and is dissipated there, consistent with the $E(k)\sim
    k^{-3}$ enstrophy-cascade spectrum measured in the companion energy-spectrum figure.'
  src_800: assets/img/projects/turbulence-closures/003_fig03_vorticity_evolution-800.png
  src_1600: assets/img/projects/turbulence-closures/003_fig03_vorticity_evolution-1600.png
  video: assets/img/projects/turbulence-closures/003_fig03_vorticity_evolution.mp4
- index: 4
  caption: 'DES97 vs. Spalart-Allmaras: near-wall validation and a disclosed limitation'
  topic: hybrid-rans-les
  description: Mean velocity ($U^+$ vs. $y^+$) and eddy-viscosity ($\mu_t$ vs. $y^+$)
    profiles for plain Spalart-Allmaras (solid) vs. DES97 (dashed), Re$_\tau$=180
    forcing. Near the wall, where DES97's RANS branch stays active in both closures,
    wall shear stress matches to ~9 significant figures — the length-scale hook is
    a correct no-op exactly where DES is supposed to behave like RANS. Away from the
    wall, DES97's length-scale switch mechanically engages on this 1D grid (a structural
    property of any 1D domain-spanning grid, not a tuning failure) — eddy viscosity
    collapses ~92x relative to plain SA with no genuine resolved/unsteady turbulence
    to replace it. This 1D setting cannot and does not demonstrate DES's actual purpose
    (protecting an attached boundary layer while resolving separated/unsteady turbulence
    away from the wall) — disclosed here rather than overclaimed.
  src_800: assets/img/projects/turbulence-closures/004_fig04_des97_profiles-800.png
  src_1600: assets/img/projects/turbulence-closures/004_fig04_des97_profiles-1600.png
- index: 5
  caption: 'Reynolds-stress transport (SSG) vs. DNS: a genuine, disclosed miss'
  topic: validation
  description: 'Mean-velocity profile for the SSG Reynolds-stress-transport closure
    (Speziale, Sarkar & Gatski, 1991 — solved via a direct 6-equation Reynolds-stress
    transport path, no scalar eddy viscosity at all) against Lee & Moser (2015) channel
    DNS at Re$_\tau$=180 and 1000. RMS relative error is 93%/96% respectively — a
    genuine, large, disclosed miss, reported honestly rather than hidden, even though
    this closure passes its own force-balance regression comfortably: force balance
    is a necessary, shape-independent check, not a sufficient accuracy claim. Candidate
    root causes are recorded but not individually isolated — left as genuinely open,
    not claimed as diagnosed.'
  src_800: assets/img/projects/turbulence-closures/005_fig05_rsm_vs_dns-800.png
  src_1600: assets/img/projects/turbulence-closures/005_fig05_rsm_vs_dns-1600.png
- index: 6
  caption: 'Data-driven closure correction: a genuine train/test generalization result'
  topic: data-driven
  description: 'Local-equilibrium $C_\mu(y^+)$ implied by inverting the Boussinesq
    hypothesis against DNS, compared to a 3-parameter closed-form curve fit (scipy
    curve_fit, NOT a general trained model) — a genuine train/test split: fit parameters
    come ONLY from Re$_\tau$=180, then the SAME fitted curve is evaluated, never re-fit,
    against Re$_\tau$=1000''s own independently-constructed DNS-implied profile (a
    genuinely different DNS simulation). Result: a real, disclosed generalization
    miss — 52% RMS relative error on the held-out station — even though the training
    fit itself tracks the Re$_\tau$=180 data closely. The root cause (Re$_\tau$=180''s
    own short log-law window biasing the fitted asymptote) is investigated and recorded,
    exactly the overfitting risk flagged in advance before this closure was built.'
  src_800: assets/img/projects/turbulence-closures/006_fig06_data_driven_cmu_fit-800.png
  src_1600: assets/img/projects/turbulence-closures/006_fig06_data_driven_cmu_fit-1600.png
- index: 7
  caption: 'Turbulent-kinetic-energy budget: order-of-magnitude term-by-term analysis'
  topic: budget-analysis
  description: Turbulent-kinetic-energy budget (Lee & Moser 2015 DNS, wall units)
    across the channel half-width at Re$_\tau$=180 and 1000, the standard textbook
    TKE-budget presentation (cf. Pope, Turbulent Flows, Fig. 7.24). Production and
    dissipation dominate and nearly balance through most of the log layer, with production
    sharply peaked in the buffer layer ($y^+\approx$11-15) while dissipation remains
    large all the way to the wall, where viscous transport takes over. This is exactly
    the order-of-magnitude structure a RANS closure's production/dissipation transport
    equations are built to capture directly. Pressure-strain is identically zero here
    by construction (it redistributes energy between Reynolds-stress components without
    changing their sum, exactly why the Reynolds-stress-transport model above must
    model it explicitly even though it drops out of the scalar TKE equation).
  src_800: assets/img/projects/turbulence-closures/007_fig07_tke_budget_order_of_magnitude-800.png
  src_1600: assets/img/projects/turbulence-closures/007_fig07_tke_budget_order_of_magnitude-1600.png
- index: 8
  caption: Vorticity field and Okubo-Weiss coherent-structure segmentation
  topic: vortex-identification
  description: 'Left: instantaneous vorticity field from a McWilliams (1984)-initialized,
    Smagorinsky-LES-closed 2D decaying-turbulence run (N=96, t=4.0s), re-solved via
    `turbpy.solvers.ns2d.solve_ns2d_les`. Right: the SAME instant segmented by the
    Okubo (1970)/Weiss (1991) parameter OW=S^2-omega^2 into vortex-dominated (blue),
    strain-dominated (red), and ambiguous (white) regions — addressing vorticity pseudocolor''s
    own blind spot (a strong non-rotating strain region is invisible in the left panel).'
  src_800: assets/img/projects/turbulence-closures/008_tv_fig01_vorticity_okubo_weiss-800.png
  src_1600: assets/img/projects/turbulence-closures/008_tv_fig01_vorticity_okubo_weiss-1600.png
- index: 9
  caption: Q-criterion vortex identification and line integral convolution
  topic: vortex-identification
  description: 'Left: Q-criterion (positive values only) on the same decaying-turbulence
    snapshot — in 2D incompressible flow this is exactly -0.5×Okubo-Weiss (verified
    by hand), so it carries no new information over the companion segmentation figure,
    included to show the more widely recognized CFD name for the same quantity. Right:
    Line Integral Convolution (Cabral & Leedom, 1993) of the velocity field, alpha-blended
    over vorticity — a dense, direction-revealing texture with no arbitrary streamline
    seed points.'
  src_800: assets/img/projects/turbulence-closures/009_tv_fig02_qcriterion_lic-800.png
  src_1600: assets/img/projects/turbulence-closures/009_tv_fig02_qcriterion_lic-1600.png
- index: 10
  caption: Premultiplied energy spectrum and spectral energy flux
  topic: spectral-analysis
  description: 'Left: k·E(k) — equal areas under this curve correspond to equal energy
    in a decade of wavenumber, so the peak marks the energy-containing scale directly.
    Right: the resolved-scale spectral flux Π(k) (Frisch, 1995), computed from the
    SAME instantaneous field — negative Π at low k (blue) is the signature of 2D turbulence''s
    inverse energy cascade (Kraichnan, 1967); positive Π at high k (red) is the companion
    forward enstrophy cascade. Neither cascade direction is visible from the spectrum''s
    slope alone. (A sign-convention bug in the underlying flux computation was found
    and fixed by measuring a real solver''s own energy transfer directly, not just
    trusting an energy-conservation identity that cannot distinguish a flux from its
    negation — see notes.md.)'
  src_800: assets/img/projects/turbulence-closures/010_tv_fig03_spectra_premult_flux-800.png
  src_1600: assets/img/projects/turbulence-closures/010_tv_fig03_spectra_premult_flux-1600.png
- index: 11
  caption: Second-order velocity structure function
  topic: statistics
  description: S₂(r)=⟨|u(x+r)-u(x)|²⟩ computed directly from the decaying-turbulence
    velocity field along one axis, log-log with a Kolmogorov (1941) r^(2/3) reference
    slope overlaid — departure from this slope (visible curvature) is the classical
    intermittency signature She & Lévêque (1994) correct for in higher-order structure
    functions, not attempted here (a single decaying 2D snapshot at this resolution
    is too short a statistical sample for a reliable intermittency exponent measurement,
    disclosed rather than a forced claim).
  src_800: assets/img/projects/turbulence-closures/011_tv_fig04_structure_function-800.png
  src_1600: assets/img/projects/turbulence-closures/011_tv_fig04_structure_function-1600.png
- index: 12
  caption: Joint distribution of velocity-gradient invariants (Q, R)
  topic: statistics
  description: The classical "teardrop" joint PDF (Chong, Perry & Cantwell, 1990)
    pooling every grid point's local flow topology into one statistical picture —
    a genuinely different perspective from any single-instant spatial field plot,
    at the cost of discarding all spatial (WHERE) information.
  src_800: assets/img/projects/turbulence-closures/012_tv_fig05_qr_invariants-800.png
  src_1600: assets/img/projects/turbulence-closures/012_tv_fig05_qr_invariants-1600.png
- index: 13
  caption: 'Closure scorecard: RMS log-law error across model and Reynolds number'
  topic: validation
  description: Every cell re-solved directly by this script via the same DNS-comparison
    function this study's own registered benchmark entries call — never hand-copied
    from those entries' text. A closure scorecard turns a table a reader must scan
    row-by-row into a pattern a reader sees at a glance (e.g. an entire model family
    struggling at one Reynolds number shows as a column-wide bright stripe) — it does
    not explain WHY any one cell is high; that still requires the specific benchmark
    entry's own disclosed caveat. Color scale capped at 100% relative error (with
    an "over" marker) so one 142% outlier does not squash every other, more informative,
    cell into one narrow color band.
  src_800: assets/img/projects/turbulence-closures/013_tv_fig06_closure_scorecard-800.png
  src_1600: assets/img/projects/turbulence-closures/013_tv_fig06_closure_scorecard-1600.png
- index: 14
  caption: 'Anisotropy Painting: barycentric-colored Reynolds-stress ribbon (invented
    technique)'
  topic: anisotropy
  description: 'Each wall-normal point''s Lumley-triangle position (ξ, η), computed
    from a converged SSG Reynolds-stress-transport channel_half solve (Re$_\tau$=180
    forcing), is mapped to an RGB color via barycentric coordinates (Banerjee et al.,
    2007 color convention, reused not reinvented) and painted as a single ribbon next
    to the classical triangle scatter — so the turbulence state (one-component / two-component
    / isotropic) reads as a color at a glance instead of a position in a triangle
    the reader must decode. The true-wall row is excluded: it is a numerical placeholder
    in the closure''s own state (three Reynolds-stress components floored to the same
    value there), which maps to the isotropic corner by the anisotropy tensor''s own
    algebra regardless of the floor''s magnitude — a spurious "isotropic wall" artifact,
    not the highly anisotropic state real near-wall turbulence physically has, found
    by checking this exact figure against that expectation before trusting it.'
  src_800: assets/img/projects/turbulence-closures/014_tv_fig07_anisotropy_painting-800.png
  src_1600: assets/img/projects/turbulence-closures/014_tv_fig07_anisotropy_painting-1600.png
- index: 15
  caption: 'Instrument Panel: synchronized field/spectrum/time-series dashboard (invented
    technique)'
  topic: invented-technique
  description: 'One video, three synchronized panels: the vorticity field, its own
    live energy spectrum (re-fit every frame, not interpolated), and a normalized
    energy/enstrophy time history swept by a moving cursor — so a viewer watches the
    decay dynamics and its own spectral signature evolve together in real time, rather
    than mentally aligning a separately-rendered field video against a separately-rendered
    spectrum plot. Built on McWilliams (1984)-initialized, Smagorinsky-LES-closed
    decaying 2D turbulence (N=80, t_end=2.5s). Energy decays visibly slower than enstrophy,
    consistent with 2D turbulence''s own inverse energy / forward enstrophy dual-cascade
    phenomenology.'
  src_800: assets/img/projects/turbulence-closures/015_tv_mov01_instrument_panel-800.png
  src_1600: assets/img/projects/turbulence-closures/015_tv_mov01_instrument_panel-1600.png
  video: assets/img/projects/turbulence-closures/015_tv_mov01_instrument_panel.mp4
- index: 16
  caption: 'Scale Telescope: sweeping a band-pass window through wavenumber space
    (invented technique)'
  topic: invented-technique
  description: 'The SAME instantaneous vorticity field, band-pass filtered through
    12 contiguous wavenumber windows swept from k=0 up to the wavenumber holding 99.9%
    of the field''s own energy — rather than a time sweep, the sweep AXIS here is
    scale itself: watch the field''s structure dissolve from broad, large-eddy shapes
    at low k to fine, thread-like filaments at high k, with a marker tracking the
    current window''s position on the field''s own energy spectrum. A genuine novelty
    search (disclosed in the code) found scale-decomposition/wavelet field plots and
    multi-panel scale comparisons, but no video specifically sweeping a moving band-pass
    window as its own time axis.'
  src_800: assets/img/projects/turbulence-closures/016_tv_mov02_scale_telescope-800.png
  src_1600: assets/img/projects/turbulence-closures/016_tv_mov02_scale_telescope-1600.png
  video: assets/img/projects/turbulence-closures/016_tv_mov02_scale_telescope.mp4
