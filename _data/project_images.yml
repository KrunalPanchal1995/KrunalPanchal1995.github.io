- index: 25
  caption: 'Vanishing Horizon: a real Picard residual''s own decay against two distinct
    vanishing floors (invented technique)'
  topic: invented-technique
  description: 'The SAME Realizable k-epsilon channel run as the Magnitude Cascade
    Ledger figure. `change` (the Picard residual) decays roughly linearly in log-space
    from iteration ~50 onward — a clean geometric convergence rate, visible directly
    from the plotted slope — crossing the relative-irrelevance floor (dashed: the
    residual''s own scale relative to the equation''s dominant term) well before float64''s
    absolute denormal floor (dash-dot) becomes relevant at all. The real point: a
    residual can stay numerically alive by a huge margin while already being physically
    irrelevant to the equation''s own dominant scale — two genuinely distinct notions
    of "vanishing" this technique makes visually distinguishable for the first time
    in this study. Novelty search: found log-decay plots and numerical-underflow discussion
    treated separately, but no prior art drawing both thresholds on the same axis
    at once.'
  src_800: assets/img/projects/turbulence-closures/025_fig13_vanishing_horizon-800.png
  src_1600: assets/img/projects/turbulence-closures/025_fig13_vanishing_horizon-1600.png
- index: 26
  caption: 'Decade-Band Field Map: a real decaying-turbulence snapshot in discrete
    power-of-ten bands (invented technique)'
  topic: invented-technique
  description: 'The same McWilliams (1984)-initialized decaying 2D turbulence field
    this study''s other figures use (N=96, t=3.0s, ν=1e-3), rendered in discrete power-of-ten
    bands instead of a continuous colormap. A genuine, checked-against-expectation
    finding: the dominant structure is NOT "vortex cores several decades above background"
    (a first-draft caption assumption that did not survive actually looking at the
    rendered figure) — at this modest diffusion time the field has not developed that
    much dynamic range, so most of the domain sits at decade 0. What the discrete
    banding DOES make legible, that a continuous colormap does not, is the field''s
    own thin filamentary zero-crossing topology: everywhere vorticity changes sign,
    |ω| passes through very small values, producing the dark low-decade threads visible
    here. Novelty search: found symmetric-log color scaling used routinely for large-dynamic-range
    fields, and discrete choropleth banding used in other domains (e.g. earthquake-magnitude
    maps), but no prior art applying discrete decade banding to a CFD scalar field''s
    own spatial structure as its own named technique.'
  src_800: assets/img/projects/turbulence-closures/026_fig14_decade_band_vorticity-800.png
  src_1600: assets/img/projects/turbulence-closures/026_fig14_decade_band_vorticity-1600.png
