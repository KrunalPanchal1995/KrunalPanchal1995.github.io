- index: 24
  caption: 'Magnitude Cascade Ledger: order-of-magnitude analysis of a real Picard
    iteration (invented technique)'
  topic: invented-technique
  description: 'The `tau_wall`/`change` (residual) terms logged by the new `RunLogger`
    telemetry API at every Picard iteration of a real Realizable k-epsilon channel
    solve (N=61, wall-clustered), rendered as a Magnitude Cascade Ledger — every logged
    term overlaid on one shared log10-magnitude axis, with the currently-dominant
    term''s own line segment drawn thick so dominance switches are visible at a glance
    rather than requiring cross-reading separate plots. `tau_wall` settles to its
    converged value within a handful of iterations while `change` continues decaying
    for many more — a genuine, measured separation between how fast an aggregate force
    balance settles versus how fast the full iterative residual does. Novelty search:
    found log-magnitude plots of individual quantities and unrelated "waterfall" charts
    for cumulative sums, but no prior art overlaying an equation''s own full term
    set with dominance highlighted as it changes over a run.'
