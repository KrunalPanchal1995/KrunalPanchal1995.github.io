  src_800: assets/img/projects/dokimazo/05_race_2d_poster-800.png
- index: 6
  caption: The same four solvers on Rastrigin, a highly multimodal landscape
  topic: solver-visualization
  description: On a single smooth valley (Rosenbrock, above) every solver takes visibly
    the same route. Rastrigin's many local minima tell a different story on the same
    shared budget — the two gradient-based methods converge in a handful of evaluations
    to whichever nearby local minimum they land in first, Nelder-Mead stalls near
    its own starting point, and only IPOP-CMA-ES's population-wide search (visible
    spanning the whole box) reaches the true global optimum, via several restart escapes
    from earlier local minima.
  video: assets/video/dokimazo/06_race_rastrigin.mp4
  src_800: assets/img/projects/dokimazo/06_race_rastrigin_poster-800.png
- index: 7
  caption: Search trajectory over a genuine 3-decision-variable problem
  topic: solver-visualization
  description: A literal height-map surface (z = f(x, y)) only exists for exactly
    2 inputs and 1 output — for a real 3-variable system there is no single such surface
    to draw. This is the mathematically honest alternative for "a 3D surface trace
    for a three-variable system" — every point IPOP-CMA-ES actually evaluated, plotted
    at its own (x1, x2, x3) coordinate and colored by objective value on a log scale,
    with the converging search path traced through that 3D decision space rather than
    mislabeled as a surface it structurally can't be.
  video: assets/video/dokimazo/07_threevar_trajectory.mp4
  src_800: assets/img/projects/dokimazo/07_threevar_trajectory_poster-800.png
- index: 8
  caption: Sampler coverage — plain random vs. two quasi-Monte-Carlo designs
  topic: solver-visualization
  description: The same number of points drawn by three of dokimazo's registered samplers
    over an identical 2-D box — plain Monte Carlo (visibly clustered, with real gaps)
    against Sobol' and Latin-Hypercube quasi-Monte-Carlo designs, whose center-L2
    discrepancy (a standard numerical measure of how evenly points fill a space) comes
    out roughly two orders of magnitude lower at this sample size, matching the visibly
    more even coverage.
  src_800: assets/img/projects/dokimazo/08_sampler_comparison-800.png
- index: 9
  caption: Solution mapping — extracting a Pareto front from a bi-objective sample
  topic: solver-visualization
  description: 300 points sampled from a standard bi-objective test problem (ZDT1),
    with dokimazo's fast-non-dominated-sort extracting the non-dominated subset (red)
    from the dominated majority (gray) against the problem's own known true front
    (gray line). The extracted front sitting above the true one is expected, not an
    error — ZDT1's true front requires an auxiliary input to be exactly zero, unreachable
    by plain random sampling — and honestly shows what solution mapping does (extract
    a front from a given sample) versus what it doesn't (generate a good sample in
    the first place, a real multi-objective solver's job).
  src_800: assets/img/projects/dokimazo/09_pareto_zdt1-800.png
- index: 10
  caption: A real 3D surface trace — Rosenbrock, CMA-ES search path
  topic: solver-visualization
  description: A literal height-map surface z = log10(1 + f(x1, x2)) for Rosenbrock's
    single curved valley, with a real IPOP-CMA-ES run's full evaluation cloud and
