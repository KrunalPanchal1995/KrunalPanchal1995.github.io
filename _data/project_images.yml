  topic: h2o2-validation
  description: Chemical stiffness ratio (log scale, colour-mapped) across the same
    temperature/pressure/equivalence-ratio grid as the ignitability map — showing
    how numerically stiff the kinetics get far outside the small region a reference
    NeuralODE was trained on.
  src_800: assets/img/projects/mosiac/008_02c_stiffness_3d_map-800.png
  src_1600: assets/img/projects/mosiac/008_02c_stiffness_3d_map-1600.png
