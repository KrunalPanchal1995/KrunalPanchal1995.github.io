  src_800: assets/img/projects/mosiac/020_03_nominal_running-800.png
  src_1600: assets/img/projects/mosiac/020_03_nominal_running-1600.png
- index: 21
  caption: 'Step 4 — done: 52 result tables in 23.5 seconds'
  topic: wt-4-nominal-done
  description: 'Completion state: "nominal_htc — done, Wall time: 23.5s · 52 table(s)."
    The Tables tab shows real per-target predicted-vs-observed rows (here, dataset
    TIG_0001 at 1000K); the full run wrote 52 case directories with time-history CSVs,
    a mechanism copy, and solver logs under SIM_RUNS/nominal_htc/.'
  src_800: assets/img/projects/mosiac/021_04_nominal_done-800.png
  src_1600: assets/img/projects/mosiac/021_04_nominal_done-1600.png
- index: 22
  caption: Step 5 — Ignition-Delay Sensitivity, configured
  topic: wt-5-idt-config
  description: 'A second, self-contained tool: ignition-delay sensitivity d ln(tau)/d
    ln(k) for one condition (H2 fuel, T=1200K, P=13.5atm, phi=1.0, constant-volume
    reactor, brute-force method, top 20 reactions) — same mechanism, a different diagnostic
    question.'
  src_800: assets/img/projects/mosiac/022_05_idt_filled-800.png
  src_1600: assets/img/projects/mosiac/022_05_idt_filled-1600.png
- index: 23
  caption: Step 6 — done in 2.4 seconds
  topic: wt-6-idt-done
  description: 'The completed run, writing a JSON of normalized sensitivity coefficients
    for all 29 reactions. The top result is physically exactly right: H + O2 <=> O
    + OH (the dominant chain-branching step) has the largest-magnitude coefficient
    (-1.62), and H + O2 + N2 <=> HO2 + N2 (a chain-terminating three-body step) is
    next, with the opposite sign (+0.79) -- faster branching shortens ignition delay,
    faster termination lengthens it.'
  src_800: assets/img/projects/mosiac/023_06_idt_done-800.png
  src_1600: assets/img/projects/mosiac/023_06_idt_done-1600.png
- index: 24
  caption: The 30-target design space for the optimization attempt
  topic: wt-7-design-space
  description: Temperature/pressure/equivalence-ratio coverage of the reduced 30-target
    subset used for the optimization run below, generated automatically as the first
    step of that pipeline before any fitting starts.
  src_800: assets/img/projects/mosiac/024_09_tpphi_space-800.png
  src_1600: assets/img/projects/mosiac/024_09_tpphi_space-1600.png
- index: 25
  caption: Step 7 — Optimization, running
  topic: wt-8-opt-running
  description: The Optimization tool, pointed at a copy of the bundled H2 project
    config with generations cut from 20,000 to 5 and targets from 426 to 30 for a
    demo-length run (the real setting would take hours) -- everything else (mechanism,
    solver, targets) is the same real H2/O2 case.
  src_800: assets/img/projects/mosiac/025_07_opt_filled_running-800.png
  src_1600: assets/img/projects/mosiac/025_07_opt_filled_running-1600.png
- index: 26
  caption: Step 8 — a real limitation, shown rather than hidden
  topic: wt-9-opt-error
  description: 'The optimizer got through target export, the design-space plot above,
    and parsing the joint-uncertainty data (3 reactions) before failing: its sensitivity-analysis
    sub-step expects a nominal-simulation case directory at a specific relative path
    (nominal/case-7) that this standalone run hadn''t produced yet. A real dependency
    between two of the GUI''s own tools, caught by actually running them back to back
    rather than reading the source.'
  src_800: assets/img/projects/mosiac/026_08_opt_error-800.png
  src_1600: assets/img/projects/mosiac/026_08_opt_error-1600.png
