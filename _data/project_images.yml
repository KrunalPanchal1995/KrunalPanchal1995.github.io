- index: 19
  caption: Two-point spatial autocorrelation and integral length scale
  topic: statistics
  description: R(r) computed from the decaying-2D-turbulence snapshot's own u velocity
    component along one axis, via the Wiener-Khinchin theorem. Integral length scale
    L=0.588 m (truncated at R(r)'s first zero-crossing, the standard practical cutoff
    on a finite/periodic domain) — the field's own characteristic large-eddy size,
    directly comparable to the k0=6 forcing wavenumber of its McWilliams (1984) initial
    condition (L_forcing=2π/6=1.047 m).
