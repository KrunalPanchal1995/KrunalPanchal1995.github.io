mosiac:
- index: 7
  caption: Ignitability map (3D)
  topic: h2o2-validation
  description: A 3D scatter of ignitable vs. non-ignitable points across temperature,
    pressure and equivalence ratio (0.3-6, step 0.3, 10s ignition-time bound). The
    small clustered region on the surface is the entire condition range a reference
    NeuralODE was trained on — the coloured field around it is everywhere this sweep
    additionally tests.
