  src_1600: assets/img/projects/sciml/014_species_grid_T1502_neutral-1600.png
- index: 15
  caption: First-layer saturation across a 16-version normalization ablation
  topic: diagnostics
  description: 'Whether the network''s first tanh layer saturates (a classic vanishing-gradient
    failure mode), swept across sixteen single-variable versions of the same architecture.
    Every version training directly in raw physical units (red titles) saturates fully;
    the three versions built on a per-channel [0,1] normalization (green titles: v1.3,
    v1.14, v1.15) never fully saturate — a normalization choice with a large, mechanistic
    effect on trainability, found by instrumenting the training loop itself rather
    than only watching the loss curve.'
  src_800: assets/img/projects/sciml/015_saturation_curve_grid_L1-800.png
  src_1600: assets/img/projects/sciml/015_saturation_curve_grid_L1-1600.png
- index: 16
  caption: PC-NODE replication — predicted vs. Cantera ground truth
  topic: replication
  description: A replication of Kumar, Kumar & Pal (2025, Combustion Theory and Modelling
    29(3); arXiv:2312.00038) — a physics-constrained neural ODE for stiff H2/air autoignition
    — reproducing the paper's network, loss and training-grid specification exactly
    (see the project README's own component-by-component comparison table). At the
    checkpoints saved so far (33 epochs for the baseline NODE, 3 for PC-NODE), neither
    model has converged onto the ignition trajectory yet — both traces sit flat near
    the initial condition while Cantera's true trajectory ignites — logged honestly
    rather than only shown once it works.
  src_800: assets/img/projects/sciml/016_trajectories-800.png
  src_1600: assets/img/projects/sciml/016_trajectories-1600.png
- index: 17
  caption: PC-NODE replication — elemental mass-conservation drift
  topic: replication
  description: 'The paper''s own headline comparison: elemental mass-conservation
    drift over time for the physics-constrained model (PCNODE) against the unconstrained
    baseline (NODE). At these early checkpoints the result is partial, not a clean
    win — PCNODE drifts less than NODE for the H element, consistent with the paper''s
    claim, but not yet for O — a nuance worth keeping rather than rounding off to
    "it worked."'
