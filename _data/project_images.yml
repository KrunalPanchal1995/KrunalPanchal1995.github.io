- index: 20
  caption: Quadrant decomposition of the resolved shear-stress correlation
  topic: statistics
  description: 'Quadrant analysis (Wallace, Eckelmann & Brodkey, 1972) applied to
    the same decaying-2D-turbulence snapshot''s spatial velocity fluctuations — NOT
    a wall-bounded shear flow, so the classical "ejection"/"sweep" names are not literally
    applicable here (disclosed in the code); the underlying quadrant decomposition
    of -⟨u′v′⟩ is still meaningful. Individual quadrant fractions exceeding 100%/going
    negative is itself a genuine result: this unforced-shear field has a small net
    -⟨u′v′⟩, so normalizing by that small denominator amplifies the four quadrants''
    own comparably-sized raw contributions — exactly the contrast the classical near-wall
    picture (sustained mean shear keeps the net correlation large) would not show.'
  src_800: assets/img/projects/turbulence-closures/020_tv_fig09_quadrant_analysis-800.png
