  src_800: assets/img/projects/dokimazo/10_surface_trace_3d_poster-800.png
- index: 11
  caption: The same surface treatment on Himmelblau — four equal global minima
  topic: solver-visualization
  description: 'The same rotating height-map treatment applied to Himmelblau, chosen
