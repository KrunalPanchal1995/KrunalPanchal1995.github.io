    I write about the research as I do it, not just after it''s published — and occasionally about questions that don''t fit inside a paper at all. Until the first long-form posts land, everything written on this site lives in the places below, each one linked. The four sections here are the planned shape of what''s coming.


    ## Research Notes


    Technical explanations of methods and problems from the research itself.


    - **[vZero — A Neural ODE Research Playground](/projects/neural-ode-playground/)** — the project page is itself a long-form technical document: 44 script versions unified into one codebase, a real 12-optimizer race, four PINN benchmark case studies with the losing rows published, and an executed optimizer-race notebook embedded in full.

    - **[Publications](/publications/)** — 13 journal articles, conference papers and preprints, searchable by author, year and abstract text.


    ## Essays


    Longer pieces about science, computation and how models relate to the systems they describe.


    - **[Research philosophy](/about/#research-philosophy)** — why a rate constant is a range, not a value, and the 115-run audit that found a supposed "10× improvement" was mostly seed noise.


    ## Food for Thought


    *Questions, reflections and things that stayed with me.*


    - **[News](/news/)** — short items on what''s happening in the research: the PhD conferred, and three abstracts accepted at the 64th Japanese Symposium on Combustion, Fukuoka.


    ## Journal


    *Shorter, more personal observations — still being written.*


    ---


    [All posts, in order →](/blog/)

    '
