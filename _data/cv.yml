  summary: >
    I develop optimization, uncertainty-quantification and scientific-ML methods
    for expensive, stiff physical simulations, using combustion chemical kinetics
    as a primary proving ground. My PhD produced MOSIAC, an open-source workbench
    for uncertainty-aware combustion mechanism optimization, alongside hands-on
    experimental work on pool-flame characterization and downdraft gasification.

