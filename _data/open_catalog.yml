# Open-science catalogue (WP-J). Read by /open/, the request-access component and the Studio (open_ids.json).
# access: open  -> code + PDF are downloadable now (files: must exist under assets/open/<id>/)
# access: request -> shared by email after the owner approves (requestable: [code, pdf])
# OWNER: change `access`, `requestable`, `files`, `title`, `notes` freely. scripts/build_open_catalog.py --apply never overwrites them.
# The script refreshes only: kind, project, studio, explainers. Comments in this file are not kept: use `notes:`.
# promo-* items (WP-M) are the Math Studio clips on #promos (Beyond the projects): code + PDF on request, free of cost.
# explainers may hold a glob such as concept.flow.*: the Studio shows code for those explainers when the item is open.
