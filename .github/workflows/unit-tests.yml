name: unit-tests
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Style contract
        run: npm run lint:style-contract
      - name: Production build
        run: bundle exec jekyll build
      - name: Integration scripts
        run: |
          set +e
          fail=0
          for t in comments plugin_toggles distill bootstrap_compat upgrade_cli css_minify new_plugins; do
            echo "::group::integration_$t"
            bash test/integration_$t.sh; rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then echo "::error::integration_$t failed ($rc)"; fail=1; fi
          done
          exit $fail
