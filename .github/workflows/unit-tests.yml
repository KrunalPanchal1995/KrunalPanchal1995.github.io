name: unit-tests
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: System deps (same as deploy.yml)
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
      - name: Style contract
        run: npm run lint:style-contract
      - name: Production build
        run: JEKYLL_ENV=production bundle exec jekyll build
      - name: Integration scripts
        run: |
          set +e
          fail=0
          # integration_comments and integration_distill are intentionally not run: they assert al-folio's demo blog posts
          # (/blog/2022/giscus-comments/, /blog/2021/distill/), which this personalised site does not ship (no _posts/).
          # Re-add them here if those posts or features are ever added.
          for t in plugin_toggles bootstrap_compat upgrade_cli css_minify new_plugins; do
            echo "::group::integration_$t"
            bash test/integration_$t.sh; rc=$?
            echo "::endgroup::"
            if [ $rc -ne 0 ]; then echo "::error::integration_$t failed ($rc)"; fail=1; fi
          done
          exit $fail
